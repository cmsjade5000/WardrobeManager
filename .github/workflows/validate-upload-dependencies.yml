name: Validate upload dependency update

on:
  push:
    branches:
      - codex/validate-wardrobe-dependencies

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 780c787f0436db588bea1ad723e33320f7e2a9a9
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/uploads/
            !/prisma/dev.db
            !/.env
            !/.env.local
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Assess compatible production dependency repairs
        run: |
          test "$(git rev-parse HEAD)" = "780c787f0436db588bea1ad723e33320f7e2a9a9"
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit-before.json" || true
          npm audit fix --package-lock-only --ignore-scripts --omit=dev --no-fund --json > "$RUNNER_TEMP/repair.json" || true
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit-after.json" || true
          node --input-type=commonjs <<'JS'
          const fs = require('node:fs');
          for (const phase of ['before', 'after']) {
            const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/audit-' + phase + '.json', 'utf8'));
            if (!report.metadata?.vulnerabilities) throw new Error('No audit result');
            console.log('PRODUCTION_AUDIT', phase, JSON.stringify(report.metadata.vulnerabilities));
            for (const [name, item] of Object.entries(report.vulnerabilities)) {
              const sources = item.via.map(v => typeof v === 'string' ? v : [v.title, v.url, v.range]);
              console.log('AFFECTED', phase, JSON.stringify({ name, severity: item.severity, fix: item.fixAvailable, nodes: item.nodes, sources }));
            }
          }
          JS
          git diff --check -- package.json package-lock.json
          git hash-object package.json package-lock.json
          git diff --no-color --unified=3 -- package.json package-lock.json | base64 -w 512 | sed 's/^/MANIFEST_DIFF /'
      - name: Clean install and prepare test client
        run: |
          npm ci --no-audit --no-fund
          ./node_modules/.bin/prisma generate
      - name: Run fixture suite
        run: npm test -- --reporter=verbose
      - name: Type check and build
        run: |
          npm run check
          npm run build
      - name: Assess installed production dependencies
        run: |
          npm ls --all multer adm-zip sharp ws uuid
          npm audit --omit=dev --json > "$RUNNER_TEMP/wardrobe-audit.json" || true
          node -e "const a=require(process.env.RUNNER_TEMP+'/wardrobe-audit.json'); if(!a.metadata?.vulnerabilities) process.exit(1); console.log('Audit counts', JSON.stringify(a.metadata.vulnerabilities)); console.log('Audit packages', Object.keys(a.vulnerabilities||{}).sort().join(', '))"
      - name: Exercise local background removal on synthetic item upload
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("server/__tests__/api.test.ts").read_text()
          settings = 'process.env.BG_REMOVAL_ENABLED = "false";'
          check = 'expect(response.body.imageUrl).toMatch('
          assert source.count(settings) == 1 and source.count(check) == 1
          source = source.replace(settings, 'process.env.BG_REMOVAL_ENABLED = "true";')
          source = source.replace(check, 'expect(response.body.imageUrl).toContain("-cutout-standard.png");\n      ' + check)
          Path("server/__tests__/background-local.test.ts").write_text(source)
          PY
          ./node_modules/.bin/vitest run server/__tests__/background-local.test.ts -t 'stores a synthetic PNG from a multipart item upload' --testTimeout=180000 --reporter=verbose
