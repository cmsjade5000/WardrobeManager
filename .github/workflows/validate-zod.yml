name: Verify wardrobe validation
on:
  push:
    branches: ['validation/wardrobe-zod-lock-20261117']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e21da874a745bd879875d8608266c1aae0f17e83
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/uploads/
            !/prisma/dev.db
            !/.env*
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked packages
        run: |
          test "$(git rev-parse HEAD)" = 'e21da874a745bd879875d8608266c1aae0f17e83'
          npm ci --no-audit --no-fund
          ./node_modules/.bin/prisma generate
      - name: Verify validator and image paths
        run: npm test -- --reporter=verbose
      - name: Type check
        if: ${{ !cancelled() }}
        run: npm run check
      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build
      - name: Dependency summary
        if: ${{ !cancelled() }}
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit.json" || true
          node -e "const a=require(process.env.RUNNER_TEMP+'/audit.json'); if(!a.metadata?.vulnerabilities) process.exit(1); console.log('Counts',JSON.stringify(a.metadata.vulnerabilities));"
          npm view @imgly/background-removal-node@1.4.5 gitHead
