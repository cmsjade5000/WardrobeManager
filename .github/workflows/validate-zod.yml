name: Verify installed dependency audit
on:
  push:
    branches: ['validation/wardrobe-zod-lock-20261117']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: accf5cf20f87be21fa7744c53b748146ac24bb33
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/uploads/
            !/prisma/dev.db
            !/.env*
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify checkout and dependency audit summary
        run: |
          test "$(git rev-parse HEAD)" = 'accf5cf20f87be21fa7744c53b748146ac24bb33'
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit.json" || true
          node --input-type=commonjs <<'NODE'
          const audit = require(process.env.RUNNER_TEMP + '/audit.json');
          if (!audit.metadata?.vulnerabilities) process.exit(1);
          const records = Object.keys(audit.vulnerabilities).sort().map(name =>
            [name, audit.vulnerabilities[name].nodes.slice().sort()]);
          const digest = require('node:crypto').createHash('sha256').update(JSON.stringify(records)).digest('hex');
          console.log('Audit counts', JSON.stringify(audit.metadata.vulnerabilities));
          console.log('Inventory checksum', digest);
          NODE
